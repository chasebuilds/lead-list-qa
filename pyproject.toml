[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-list-qa"
version = "0.1.0"
description = "Offline quality checks for B2B contact lists: email and phone format, duplicates, role and free-mail addresses, title buckets."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chase Builds" }]
dependencies = ["openpyxl>=3.1", "phonenumbers>=8.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
leadqa = "lead_list_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_list_qa = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["lead_list_qa"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lead_list_qa", "benchmark"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
